<app-modal [title]="title">
  <div class="flex flex-col gap-4">
    <textarea [(ngModel)]="reason" class="w-full p-4 border rounded-xl" placeholder="Введіть причину..."></textarea>
    <button (click)="confirm()" class="w-full py-3 bg-slate-900 text-white font-black rounded-xl hover:bg-slate-800 transition-all">
      Підтвердити
    </button>
  </div>
</app-modal>
