      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="bg-slate-50/50">
              <th class="p-6 text-[10px] font-black uppercase tracking-widest text-slate-400">Користувач</th>
              <th class="p-6 text-[10px] font-black uppercase tracking-widest text-slate-400 text-center">Роль</th>
              <th class="p-6 text-[10px] font-black uppercase tracking-widest text-slate-400 text-center">Статус</th>
              <th class="p-6 text-[10px] font-black uppercase tracking-widest text-slate-400 text-right">Дії</th>
            </tr>
          </thead>
          <tbody class="divide-y divide-slate-50">
            <tr *ngFor="let user of users" class="hover:bg-slate-50/30 transition-all group">
              <td class="p-6">
                <div class="flex items-center gap-4">
                  <div class="w-10 h-10 bg-slate-100 rounded-xl flex items-center justify-center font-black text-slate-400 group-hover:bg-slate-900 group-hover:text-white transition-all rotate-2 group-hover:rotate-0">
                    {{ user.email[0] | uppercase }}
                  </div>
                  <div>
                    <p class="text-sm font-black text-slate-900">{{ user.email }}</p>
                    <p class="text-[9px] font-bold text-slate-300 uppercase tracking-tighter">{{ user.id.substring(0, 8) }}...</p>
                  </div>
                </div>
              </td>
              <td class="p-6 text-center">
                <span class="px-3 py-1 bg-slate-100 rounded-lg text-[9px] font-black uppercase tracking-widest text-slate-600">
                  {{ user.role }}
                </span>
              </td>
              <td class="p-6">
                <div class="flex justify-center">
                  <div class="flex items-center gap-2 px-3 py-1 rounded-full border transition-all" 
                       [ngClass]="user.isEmailVerified ? 'border-emerald-100 bg-emerald-50 text-emerald-600' : 'border-amber-100 bg-amber-50 text-amber-600'">
                    <div class="w-1.5 h-1.5 rounded-full" [ngClass]="user.isEmailVerified ? 'bg-emerald-500' : 'bg-amber-500'"></div>
                    <span class="text-[9px] font-black uppercase tracking-widest">
                      {{ user.isEmailVerified ? 'Активний' : 'Не підтверджено' }}
                    </span>
                  </div>
                </div>
              </td>
              <td class="p-6 text-right">
                <div class="flex justify-end gap-2 opacity-0 group-hover:opacity-100 transition-all transform translate-x-2 group-hover:translate-x-0">
                  <button title="Блокувати" class="p-3 bg-red-50 hover:bg-red-500 text-red-500 hover:text-white rounded-xl transition-all active:scale-90">
                    🚫
                  </button>
                  <button title="Деталі" class="p-3 bg-slate-50 hover:bg-slate-900 text-slate-400 hover:text-white rounded-xl transition-all">
                    👁️
                  </button>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
