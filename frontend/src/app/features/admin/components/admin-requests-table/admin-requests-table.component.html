<div class="bg-white rounded-[2.5rem] border border-slate-100 shadow-sm overflow-hidden">
  <table class="w-full text-left border-separate border-spacing-0">
    <thead>
      <tr class="bg-slate-900">
        <th class="p-6 text-[10px] font-black uppercase tracking-widest text-slate-400">Запит</th>
        <th class="p-6 text-[10px] font-black uppercase tracking-widest text-slate-400 text-center">Категорія</th>
        <th class="p-6 text-[10px] font-black uppercase tracking-widest text-slate-400 text-center">Дата</th>
        <th class="p-6 text-[10px] font-black uppercase tracking-widest text-slate-400 text-right">Видалити</th>
      </tr>
    </thead>
    <tbody class="divide-y divide-slate-100">
      <ng-container *ngFor="let req of requests">
        <tr (click)="toggleRow(req.id)" class="zebra-row hover:bg-slate-50 transition-colors cursor-pointer">
          <td class="p-6">
            <p class="text-sm font-black text-slate-900">{{ req.title }}</p>
            <p class="text-[9px] font-bold text-slate-400 uppercase italic">{{ req.organization?.name }}</p>
          </td>
          <td class="p-6 text-center">
            <span class="px-3 py-1 bg-blue-50 text-blue-600 rounded-lg text-[9px] font-black uppercase border border-blue-100">{{ req.category }}</span>
          </td>
          <td class="p-6 text-center text-[10px] font-bold text-slate-400">{{ req.createdAt | date:'dd.MM.yyyy' }}</td>
          <td class="p-6 text-right">
            <button (click)="$event.stopPropagation(); delete.emit(req.id)" class="p-3 bg-red-50 text-red-500 hover:bg-red-500 hover:text-white rounded-xl transition-all">🗑️</button>
          </td>
        </tr>
        <tr *ngIf="expandedElementId === req.id" class="zebra-row">
          <td colspan="4" class="p-8 bg-slate-50/50 border-y border-slate-100">
            <p class="text-[9px] font-black text-slate-400 uppercase mb-2">Повний текст запиту</p>
            <p class="text-xs leading-relaxed text-slate-600 font-medium">{{ req.description }}</p>
          </td>
        </tr>
      </ng-container>
    </tbody>
  </table>
</div>
