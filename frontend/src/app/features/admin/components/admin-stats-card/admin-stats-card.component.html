<div class="p-8 rounded-[2.5rem] shadow-sm transition-transform hover:scale-[1.02] duration-300"
     [ngClass]="variant === 'dark' ? 'bg-slate-950 text-white shadow-2xl shadow-slate-200' : 'bg-white border border-slate-100'">
  <p class="text-[10px] font-black uppercase tracking-[0.2em] mb-6" [ngClass]="labelClass">
    {{ label }}
  </p>
  <div class="flex items-end justify-between">
    <p class="text-4xl font-black italic" [ngClass]="variant === 'dark' ? 'text-white' : 'text-slate-900'">
      {{ value || 0 | number }}
    </p>
    <ng-content></ng-content> </div>
</div>
