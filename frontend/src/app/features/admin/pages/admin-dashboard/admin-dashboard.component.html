<div class="min-h-screen bg-slate-50 pt-28 pb-12 px-4 md:px-8" 
     *ngIf="{ stats: stats$ | async, users: users$ | async } as data">
  <div class="max-w-[1400px] mx-auto space-y-8">
    
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
      
      <div (click)="setActiveTab('users')" 
           class="cursor-pointer transition-all duration-300"
           [ngClass]="activeTab === 'users' ? 'scale-100 ring-4 ring-slate-900/10 ring-offset-4 ring-offset-slate-50' : 'scale-95 opacity-60 hover:opacity-100'">
        <app-admin-stats-card label="Спільнота" [value]="data.stats?.totalUsers" variant="dark">
          <div class="text-[10px] font-bold bg-white/10 text-white px-3 py-1 rounded-xl border border-white/5 uppercase">Юзерів</div>
        </app-admin-stats-card>
      </div>

      <div (click)="setActiveTab('organizations')"
           class="cursor-pointer transition-all duration-300"
           [ngClass]="activeTab === 'organizations' ? 'scale-100 ring-4 ring-amber-500/20 ring-offset-4 ring-offset-slate-50' : 'scale-95 opacity-60 hover:opacity-100'">
        <app-admin-stats-card label="Верифікація" [value]="data.stats?.pendingOrganizations" labelClass="text-amber-500">
          <div class="flex items-center gap-2 px-3 py-1 bg-amber-50 rounded-xl border border-amber-100">
            <div class="w-2 h-2 bg-amber-500 rounded-full animate-pulse"></div>
            <span class="text-[10px] font-black uppercase text-amber-600">Очікують</span>
          </div>
        </app-admin-stats-card>
      </div>

      <div (click)="setActiveTab('requests')"
           class="cursor-pointer transition-all duration-300"
           [ngClass]="activeTab === 'requests' ? 'scale-100 ring-4 ring-blue-500/20 ring-offset-4 ring-offset-slate-50' : 'scale-95 opacity-60 hover:opacity-100'">
        <app-admin-stats-card label="Активність" [value]="data.stats?.totalRequests" labelClass="text-blue-500">
          <span class="text-[10px] font-black uppercase text-blue-600 bg-blue-50 px-3 py-1 rounded-xl">Запитів</span>
        </app-admin-stats-card>
      </div>

    </div>

    <div class="mt-8 transition-all duration-500">
      
      <div *ngIf="activeTab === 'users'" class="animate-in fade-in slide-in-from-bottom-4 duration-500">
        <app-admin-users-table [users]="data.users" (ban)="handleBan($event)"></app-admin-users-table>
      </div>

      <div *ngIf="activeTab === 'organizations'" class="animate-in fade-in slide-in-from-bottom-4 duration-500 p-12 bg-white rounded-[2.5rem] border border-slate-100 shadow-sm text-center">
        <span class="text-4xl mb-4 block">🏢</span>
        <h3 class="text-sm font-black uppercase tracking-widest text-slate-900">Модерація організацій</h3>
        <p class="text-xs font-bold text-slate-400 mt-2">Тут буде таблиця фондів, що очікують підтвердження.</p>
      </div>

      <div *ngIf="activeTab === 'requests'" class="animate-in fade-in slide-in-from-bottom-4 duration-500 p-12 bg-white rounded-[2.5rem] border border-slate-100 shadow-sm text-center">
        <span class="text-4xl mb-4 block">⚡</span>
        <h3 class="text-sm font-black uppercase tracking-widest text-slate-900">Моніторинг запитів</h3>
        <p class="text-xs font-bold text-slate-400 mt-2">Тут буде таблиця активних запитів волонтерів.</p>
      </div>

    </div>

  </div>
</div>
