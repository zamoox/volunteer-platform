<!-- organization-setup.component.html -->
<div class="min-h-screen bg-slate-950 flex items-center justify-center px-4 py-12">
  <div class="w-full max-w-[1400px] mx-auto grid grid-cols-1 lg:grid-cols-2 gap-0 rounded-[2.5rem] overflow-hidden shadow-2xl">

    <!-- Ліва панель — інфо -->
    <div class="bg-blue-600 p-16 flex flex-col justify-between">
      <div>
        <div class="w-14 h-14 bg-white/20 rounded-2xl flex items-center justify-center mb-10">
          <span class="text-2xl">🏢</span>
        </div>
        <h1 class="text-5xl font-black text-white leading-tight tracking-tight mb-6">
          Налаштування<br>організації
        </h1>
        <p class="text-blue-100 text-lg leading-relaxed max-w-sm">
          Заповніть юридичні дані вашої організації. Це необхідно для верифікації та публікації запитів на допомогу.
        </p>
      </div>

      <div class="space-y-4 mt-12">
        <div *ngFor="let step of steps"
             class="flex items-center gap-4 p-4 rounded-2xl"
             [class.bg-white/20]="step.done"
             [class.bg-white/5]="!step.done">
          <span class="text-xl">{{ step.icon }}</span>
          <span class="text-white font-bold text-sm">{{ step.label }}</span>
          <span *ngIf="step.done" class="ml-auto text-white/60 text-xs font-black uppercase">✓</span>
        </div>
      </div>
    </div>

    <!-- Права панель — форма -->
    <div class="bg-white p-16 flex flex-col justify-center">
      <h2 class="text-3xl font-black text-slate-900 tracking-tight mb-2">Юридична інформація</h2>
      <p class="text-slate-400 text-sm mb-10">Крок 2 з 2 — дані організації</p>

      <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-6">

        <!-- Назва -->
        <div class="space-y-2">
          <label class="text-[10px] font-black uppercase tracking-[0.2em] text-slate-400 ml-1">
            Повна назва організації *
          </label>
          <input formControlName="name"
                 placeholder="ГО «Волонтерський центр Києва»"
                 class="w-full px-5 py-4 bg-slate-50 border rounded-2xl text-slate-900 font-medium outline-none transition-all focus:ring-4 focus:ring-blue-500/10 focus:border-blue-500"
                 [class.border-red-400]="isInvalid('name')"
                 [class.border-slate-200]="!isInvalid('name')">
          <p *ngIf="isInvalid('name')" class="text-xs text-red-500 ml-1">
            {{ getError('name') }}
          </p>
        </div>

        <!-- ЄДРПОУ -->
        <div class="space-y-2">
          <label class="text-[10px] font-black uppercase tracking-[0.2em] text-slate-400 ml-1">
            Код ЄДРПОУ *
          </label>
          <input formControlName="edrpou"
                 placeholder="12345678"
                 inputmode="numeric"
                 maxlength="8"
                 class="w-full px-5 py-4 bg-slate-50 border rounded-2xl text-slate-900 font-mono font-bold outline-none transition-all focus:ring-4 focus:ring-blue-500/10 focus:border-blue-500 tracking-widest"
                 [class.border-red-400]="isInvalid('edrpou')"
                 [class.border-slate-200]="!isInvalid('edrpou')">
          <p *ngIf="isInvalid('edrpou')" class="text-xs text-red-500 ml-1">
            {{ getError('edrpou') }}
          </p>
        </div>

        <!-- Опис -->
        <div class="space-y-2">
          <label class="text-[10px] font-black uppercase tracking-[0.2em] text-slate-400 ml-1">
            Опис діяльності
          </label>
          <textarea formControlName="description"
                    rows="3"
                    placeholder="Коротко опишіть, чим займається ваша організація..."
                    class="w-full px-5 py-4 bg-slate-50 border border-slate-200 rounded-2xl text-slate-900 font-medium outline-none transition-all focus:ring-4 focus:ring-blue-500/10 focus:border-blue-500 resize-none">
          </textarea>
        </div>

        <div class="space-y-2">
          <label class="text-[10px] font-black uppercase tracking-[0.2em] text-slate-400 ml-1">
            Номер телефону *
          </label>

          <input
            formControlName="phone"
            type="tel"
            placeholder="+380 99 123 45 67"
            inputmode="numeric"
            maxlength="17"
            (input)="formatPhone($event)"
            class="w-full px-5 py-4 bg-slate-50 border rounded-2xl text-slate-900 font-medium outline-none transition-all focus:ring-4 focus:ring-blue-500/10 focus:border-blue-500"
            [class.border-red-400]="isInvalid('phone')"
            [class.border-slate-200]="!isInvalid('phone')"
          />

          <p *ngIf="isInvalid('phone')" class="text-xs text-red-500 ml-1">
            {{ getError('phone') }}
          </p>
        </div>

        <!-- Сайт -->
        <div class="space-y-2">
          <label class="text-[10px] font-black uppercase tracking-[0.2em] text-slate-400 ml-1">
            Вебсайт
          </label>
          <input formControlName="website"
                 type="url"
                 placeholder="https://your-org.org.ua"
                 class="w-full px-5 py-4 bg-slate-50 border border-slate-200 rounded-2xl text-slate-900 font-medium outline-none transition-all focus:ring-4 focus:ring-blue-500/10 focus:border-blue-500">
        </div>

        <!-- Кнопка -->
        <button type="submit"
                [disabled]="form.invalid || isLoading"
                class="w-full mt-4 py-5 bg-slate-950 text-white rounded-2xl font-black text-sm tracking-widest uppercase shadow-xl hover:-translate-y-0.5 active:scale-95 transition-all disabled:opacity-40 disabled:transform-none flex items-center justify-center gap-3">
          <span *ngIf="isLoading" class="w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></span>
          {{ isLoading ? 'Збереження...' : 'Завершити реєстрацію →' }}
        </button>

      </form>
    </div>
  </div>
</div>
