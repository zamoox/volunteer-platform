<div class="relative min-h-screen w-full overflow-hidden bg-slate-950">
  
  <div class="absolute inset-0 z-0">
    <app-hero-canvas></app-hero-canvas>

  </div>

  <!-- Контентна частина -->
  <main class="relative z-10 flex flex-col items-center justify-center min-h-screen px-6 text-center">
    
    <!-- Світлова пляма для акценту -->
    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[500px] h-[500px] bg-blue-500/20 blur-[120px] rounded-full"></div>

    <div class="max-w-4xl space-y-8">
      <!-- Слоган -->
      <h1 class="text-5xl md:text-8xl font-black tracking-tighter text-white leading-[0.9]">
        ЄДНІСТЬ <br>
        <span class="text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-emerald-400">
          У ДІЇ
        </span>
      </h1>

      <p class="text-lg md:text-xl text-slate-400 font-medium max-w-2xl mx-auto leading-relaxed">
        Сучасна платформа для миттєвої координації волонтерської допомоги. 
        Знаходь тих, хто поруч, та допомагай у реальному часі.
      </p>

      <!-- Кнопки -->
      <div class="flex flex-col sm:flex-row items-center justify-center gap-4 pt-4">
        <button 
            routerLink="/map"
            class="group relative px-8 py-4 bg-white text-slate-950 font-black rounded-2xl overflow-hidden transition-all hover:scale-105 active:scale-95 shadow-xl shadow-white/10"
        >
          <span class="relative z-10">ВІДКРИТИ КАРТУ</span>
          <div class="absolute inset-0 bg-gradient-to-r from-blue-100 to-white opacity-0 group-hover:opacity-100 transition-opacity"></div>
        </button>

        <button 
            routerLink="/register"
            class="px-8 py-4 bg-slate-800/50 backdrop-blur-md text-white font-black rounded-2xl border border-slate-700 hover:bg-slate-800 transition-all active:scale-95"
        >
          СТАТИ ВОЛОНТЕРОМ
        </button>
      </div>
    </div>
  </main>

  <!-- Футер або доп. інфо -->
  <footer class="absolute bottom-8 left-0 right-0 z-10 text-center">
    <span class="text-[10px] font-black uppercase tracking-[0.3em] text-slate-500 opacity-50">
