<div class="min-h-screen flex items-center justify-center bg-[#fafafa] p-6 font-sans">
      <div class="w-full max-w-[420px] bg-white rounded-[2.5rem] p-8 shadow-xl">
        <h2 class="text-2xl font-bold text-center mb-6">Новий пароль</h2>
        
        <form [formGroup]="resetForm" (ngSubmit)="onSubmit()" class="space-y-6">
          <div class="space-y-1.5">
            <label class="text-[11px] font-bold uppercase text-slate-400">Новий пароль</label>
            <input formControlName="password" type="password" class="w-full p-4 bg-slate-50 border border-slate-200 rounded-2xl" placeholder="Мінімум 6 символів">
          </div>
          <button type="submit" [disabled]="resetForm.invalid || isLoading" class="w-full py-4 bg-blue-600 text-white font-bold rounded-2xl hover:bg-blue-700 disabled:opacity-50 transition-all">
            {{ isLoading ? 'Збереження...' : 'Встановити пароль' }}
          </button>
        </form>
      </div>
</div>
