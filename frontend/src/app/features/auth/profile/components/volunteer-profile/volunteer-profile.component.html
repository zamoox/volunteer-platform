<div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
  <div class="lg:col-span-2 grid grid-cols-2 gap-4">
    <div class="p-8 bg-gradient-to-br from-blue-600 to-blue-700 rounded-[2.5rem] text-white">
      <p class="text-[10px] font-black uppercase tracking-widest opacity-60 mb-2">Завершено місій</p>
      <p class="text-4xl font-black italic">14</p>
    </div>
    <div class="p-8 bg-white border border-slate-100 rounded-[2.5rem] shadow-sm">
      <p class="text-[10px] font-black uppercase tracking-widest text-slate-400 mb-2">Рейтинг довіри</p>
      <p class="text-4xl font-black text-slate-900">4.9<span class="text-lg text-amber-400">★</span></p>
    </div>

    <div class="col-span-2 mt-4">
      <h3 class="text-xs font-black uppercase tracking-[0.2em] text-slate-400 mb-6">Запити, де я допомагаю</h3>
      <div class="space-y-3">
        <div *ngFor="let item of activeHelps" class="flex items-center justify-between p-5 bg-slate-50 rounded-2xl border border-slate-100">
          <div class="flex items-center gap-4">
            <div class="w-10 h-10 bg-white rounded-xl flex items-center justify-center shadow-sm">📦</div>
            <div>
              <!-- <p class="text-sm font-bold text-slate-900">{{item.title}}</p>
              <p class="text-[10px] font-medium text-slate-500">{{item.orgName}}</p> -->
            </div>
          </div>
          <button class="text-[10px] font-black uppercase text-blue-600 hover:underline">Чат →</button>
        </div>
      </div>
    </div>
  </div>

  <div class="space-y-4">
    <div class="p-6 bg-slate-900 rounded-[2rem] text-white">
      <h4 class="text-[10px] font-black uppercase tracking-widest text-slate-500 mb-4">Мої компетенції</h4>
      <div class="flex flex-wrap gap-2">
        <span class="px-3 py-1 bg-white/10 rounded-full text-[10px] font-bold">Логістика</span>
        <span class="px-3 py-1 bg-white/10 rounded-full text-[10px] font-bold">Медицина</span>
        <span class="px-3 py-1 bg-white/10 rounded-full text-[10px] font-bold">Водій (B, C)</span>
      </div>
    </div>
  </div>
</div>
