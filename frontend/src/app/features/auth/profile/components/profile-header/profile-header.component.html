<div class="bg-slate-950 p-10 text-white flex flex-col md:flex-row items-center justify-between gap-6 border-b border-white/5">
  <div class="flex items-center gap-8">
    <div class="w-24 h-24 bg-blue-600 rounded-3xl flex items-center justify-center text-4xl font-black shadow-xl rotate-3">
      <span class="-rotate-3">{{ initials }}</span>
    </div>

    <div>
      <h2 class="text-3xl font-black tracking-tight mb-2">{{ user.firstName || 'Користувач' }}</h2>
      <div class="flex flex-wrap gap-2 mt-2">
        
        <span class="px-3 py-1 bg-white/10 rounded-lg text-[10px] font-black uppercase tracking-widest text-blue-400 border border-white/5">
          {{ roleLabel }}
        </span>

        <span [ngClass]="user.isEmailVerified ? 'bg-emerald-500/20 text-emerald-400' : 'bg-amber-500/20 text-amber-400'" 
              class="px-3 py-1 rounded-lg text-[10px] font-black uppercase tracking-widest flex items-center gap-1.5 border border-white/5">
          <span class="w-1.5 h-1.5 rounded-full" [class.bg-emerald-400]="user.isEmailVerified" [class.bg-amber-400]="!user.isEmailVerified"></span>
          Пошта {{ user.isEmailVerified ? 'підтверджена' : 'не підтверджена' }}
        </span>

        <ng-container *ngIf="user.role === 'organization'">
          <span *ngIf="orgStatus" 
                [ngClass]="{
                  'bg-blue-500/20 text-blue-400': orgStatus === 'pending',
                  'bg-purple-500/20 text-purple-400': orgStatus === 'verified'
                }"
                class="px-3 py-1 rounded-lg text-[10px] font-black uppercase tracking-widest flex items-center gap-1.5 border border-white/5">
            <span class="w-1.5 h-1.5 rounded-full" 
                  [ngClass]="orgStatus === 'verified' ? 'bg-purple-400' : 'bg-blue-400'"></span>
            Статус: {{ orgStatus === 'verified' ? 'Офіційна організація' : 'На перевірці' }}
          </span>
        </ng-container>
      </div>
    </div>
  </div>

  <div class="flex gap-3">
    <button (click)="logout.emit()" 
            class="p-4 bg-red-500/10 hover:bg-red-500 text-red-500 hover:text-white rounded-2xl transition-all group shadow-lg shadow-red-500/10">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
      </svg>
    </button>
  </div>
</div>
