<div class="w-full space-y-6 transition-all animate-in fade-in slide-in-from-top-4 duration-500">
  
  <div class="w-full p-8 bg-white rounded-[2.5rem] border border-slate-100 shadow-sm hover:shadow-md transition-all">
    <div class="flex flex-col md:flex-row md:items-center justify-between gap-6" [class.mb-8]="isChangingPasswordMode">
      <div class="flex items-center gap-5">
        <div class="w-12 h-12 bg-slate-950 rounded-2xl flex items-center justify-center text-white shrink-0 shadow-lg shadow-slate-200">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
          </svg>
        </div>
        <div>
          <h4 class="font-black text-slate-900 text-xl tracking-tight">Пароль</h4>
          <p class="text-[10px] font-bold uppercase tracking-widest text-slate-400">Керування доступом</p>
        </div>
      </div>
      <button *ngIf="!isChangingPasswordMode" (click)="togglePasswordForm()" 
              class="px-6 py-3 bg-slate-50 hover:bg-slate-950 hover:text-white rounded-xl text-[10px] font-black uppercase tracking-widest transition-all">
        Змінити
      </button>
    </div>

    <form *ngIf="isChangingPasswordMode" [formGroup]="passwordForm" (ngSubmit)="onSubmitPasswordChange()" class="space-y-6 animate-in fade-in duration-300">
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <input formControlName="oldPassword" type="password" placeholder="Поточний пароль" class="w-full p-4 bg-slate-50 border border-slate-100 rounded-2xl text-sm font-bold focus:bg-white focus:border-slate-950 outline-none transition-all">
        <input formControlName="newPassword" type="password" placeholder="Новий пароль" class="w-full p-4 bg-slate-50 border border-slate-100 rounded-2xl text-sm font-bold focus:bg-white focus:border-slate-950 outline-none transition-all">
        <input formControlName="confirmPassword" type="password" placeholder="Підтвердження" class="w-full p-4 bg-slate-50 border border-slate-100 rounded-2xl text-sm font-bold focus:bg-white focus:border-slate-950 outline-none transition-all">
      </div>
      <div class="flex gap-3">
        <button type="button" (click)="togglePasswordForm()" class="flex-1 py-4 bg-slate-100 text-slate-500 rounded-xl text-[10px] font-black uppercase tracking-widest">Скасувати</button>
        <button type="submit" [disabled]="passwordForm.invalid || isSubmittingPassword" class="flex-1 py-4 bg-slate-950 text-white rounded-xl text-[10px] font-black uppercase tracking-widest shadow-lg disabled:opacity-30">
          {{ isSubmittingPassword ? 'Оновлення...' : 'Оновити пароль' }}
        </button>
      </div>
    </form>
  </div>

  <div class="w-full p-8 bg-white rounded-[2.5rem] border border-slate-100 shadow-sm hover:shadow-md transition-all">
    <div class="flex flex-col md:flex-row md:items-center justify-between gap-6" [class.mb-8]="isStepVerify">
      <div class="flex items-center gap-5">
        <div class="w-12 h-12 bg-blue-600 rounded-2xl flex items-center justify-center text-white shrink-0 shadow-lg shadow-blue-100">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
          </svg>
        </div>
        <div>
          <h4 class="font-black text-slate-900 text-xl tracking-tight">Двофакторна аутентифікація</h4>
          <p class="text-[10px] font-bold uppercase tracking-widest text-slate-400">Додатковий захист акаунта</p>
        </div>
      </div>
      
      <button *ngIf="!user.isTwoFactorEnabled && !isStepVerify" (click)="onEnable2FA()" 
              class="px-6 py-3 bg-blue-50 text-blue-600 hover:bg-blue-600 hover:text-white rounded-xl text-[10px] font-black uppercase tracking-widest transition-all">
        Активувати
      </button>

      <div *ngIf="user.isTwoFactorEnabled" class="px-4 py-2 bg-emerald-50 text-emerald-600 rounded-xl text-[10px] font-black uppercase border border-emerald-100">
        ✅ Активно
      </div>
    </div>

    <div *ngIf="isStepVerify" class="flex flex-col md:flex-row items-center gap-10 animate-in zoom-in duration-300 border-t border-slate-50 pt-8">
      <div class="p-3 bg-white border border-slate-100 rounded-2xl shadow-sm shrink-0">
        <img *ngIf="qrCodeUrl" [src]="qrCodeUrl" class="w-32 h-32 rounded-lg">
      </div>
      <div class="w-full max-w-sm space-y-4">
        <div class="space-y-1">
          <label class="text-[10px] font-black uppercase text-slate-400 tracking-widest ml-2">Введіть код з додатку</label>
          <input [(ngModel)]="twoFaCode" maxlength="6" placeholder="000000" 
                 class="w-full p-4 bg-slate-50 border border-slate-100 rounded-2xl text-center text-2xl font-black tracking-[0.3em] outline-none focus:border-blue-600 focus:bg-white transition-all">
        </div>
        <div class="flex gap-3">
          <button (click)="isStepVerify = false" class="flex-1 py-4 bg-slate-100 text-slate-500 rounded-xl text-[10px] font-black uppercase tracking-widest">Скасувати</button>
          <button (click)="confirm2FA()" [disabled]="twoFaCode.length !== 6"
                  class="flex-[2] py-4 bg-blue-600 text-white rounded-xl text-[10px] font-black uppercase tracking-widest shadow-lg hover:bg-blue-700 disabled:opacity-30 transition-all">
            Підтвердити
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
