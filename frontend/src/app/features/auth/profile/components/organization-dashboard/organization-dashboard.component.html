<div class="space-y-6">
  <div class="flex justify-between items-center">
    <h3 class="text-xl font-black uppercase tracking-tight">Мої оголошення</h3>
    <button class="px-4 py-2 bg-slate-900 text-white rounded-xl text-xs font-black uppercase tracking-widest hover:bg-blue-600 transition-all">
      + Створити нове
    </button>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
    <div *ngFor="let req of myRequests" class="p-6 border border-slate-100 rounded-3xl hover:shadow-lg transition-all bg-white group">
      <div class="flex justify-between items-start mb-4">
        <span class="px-2 py-1 bg-blue-50 text-blue-600 rounded text-[10px] font-black uppercase">{{req.category}}</span>
        <div class="flex gap-2 opacity-0 group-hover:opacity-100 transition-all">
          <button class="p-2 hover:bg-slate-100 rounded-lg text-slate-400 hover:text-slate-900">✎</button>
          <button class="p-2 hover:bg-red-50 rounded-lg text-slate-400 hover:text-red-500">✕</button>
        </div>
      </div>
      <h4 class="font-bold text-slate-900 mb-2">{{req.title}}</h4>
      <p class="text-xs text-slate-500 line-clamp-2 mb-4">{{req.description}}</p>
      <div class="flex items-center justify-between text-[10px] font-black uppercase tracking-widest text-slate-400">
        <span>{{req.createdAt | date}}</span>
        <span class="text-emerald-500">{{req.responsesCount || 0}} відгуків</span>
      </div>
    </div>
  </div>
</div>
