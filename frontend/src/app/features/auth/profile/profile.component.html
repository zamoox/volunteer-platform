
<div class="min-h-screen bg-slate-50 font-sans pt-28 pb-12 px-4 md:px-8 flex flex-col items-center">
  <div *ngIf="authService.currentUser$ | async as user" 
       class="w-full max-w-[1400px] mx-auto bg-white rounded-[2.5rem] shadow-2xl shadow-slate-200/50 overflow-hidden border border-slate-100 min-h-[75vh]">

    <app-profile-header 
      *ngIf="authService.currentUser$ | async as user"
      [user]="user"
      [orgStatus]="(organizationProfile$ | async)?.verificationStatus"
      (logout)="onLogout()">
    </app-profile-header>

    <div class="flex border-b border-slate-100 px-10 bg-white sticky top-0 z-20 overflow-x-auto no-scrollbar transition-all">
      <button type="button" (click)="setTab('info')" [class.active-tab]="activeTab === 'info'" class="tab-btn transition-all">Особиста інформація</button>
      <button type="button" (click)="setTab('requests')" [class.active-tab]="activeTab === 'requests'" class="tab-btn transition-all">{{ secondTabLabel(user.role) }}</button>
      <button type="button" (click)="setTab('reviews')" [class.active-tab]="activeTab === 'reviews'" class="tab-btn transition-all">Відгуки</button>
      <button type="button" (click)="setTab('settings')" [class.active-tab]="activeTab === 'settings'" class="tab-btn transition-all">Налаштування</button>
    </div>

    <div class="p-10 transition-all">
      <div [ngSwitch]="activeTab" class="transition-all">
        
        <div *ngSwitchCase="'info'">
          <app-profile-info
            [user]="user"
            [organizationProfile$]="organizationProfile$"
            [isSendingEmail]="isSendingEmail"
            [cooldownSeconds]="cooldownSeconds"
            (resendEmail)="onResendEmail($event)">
          </app-profile-info>
        </div>

        <div *ngSwitchCase="'requests'">
          <app-profile-requests
            [user]="user"
            [requests]="requests$ | async"
            [volunteerTasks]="volunteerActiveTasks()"
            [volunteerLoading]="volunteerDashboardLoading"
            [volunteerError]="volunteerDashboardError"
            [canUpdateFn]="canUpdate.bind(this)"
            [canDeleteFn]="canDelete.bind(this)"
            [volunteerNameFn]="volunteerRequestVolunteerName.bind(this)"
            [volunteerInitialFn]="volunteerRequestVolunteerInitial.bind(this)"
            [orgPhoneFn]="organizationPhoneForVolunteerTask.bind(this)"
            (editRequest)="onEditRequest($event)"
            (deleteRequest)="onDeleteRequest($event)"
            (cancelHelp)="onCancelVolunteerHelp($event)"
            (completeReview)="openCompleteReview($event)"
            (openOnMap)="openRequestOnMap($event)">
          </app-profile-requests>
        </div>

        <div *ngSwitchCase="'reviews'">
          <app-profile-reviews 
            [user]="user"
            [reviews]="volunteerReviews()"
            [isLoading]="volunteerDashboardLoading">
          </app-profile-reviews>
        </div>

        <div *ngSwitchCase="'settings'" class="w-full">
          <app-profile-settings [user]="user"></app-profile-settings>
        </div>
      </div>
    </div>
  </div>
</div>

@if (isEditModalOpen && selectedRequest) {
  <app-request-form 
    [requestToEdit]="selectedRequest"
    [lat]="selectedRequest.coords.lat"
    [lng]="selectedRequest.coords.lng"
    (closed)="closeEditModal()"
    (submitted)="onEditSubmitted()">
  </app-request-form>
}

<app-modal 
  *ngIf="isDeleteModalOpen" 
  title="Підтвердження видалення" 
  (closed)="isDeleteModalOpen = false">
  
  <div class="text-center">
    <div class="mx-auto flex items-center justify-center h-20 w-20 rounded-3xl bg-red-50 mb-8 rotate-3">
      <span class="text-red-500 text-3xl -rotate-3">🗑️</span>
    </div>
    
    <p class="text-slate-600 mb-10 text-lg font-medium leading-relaxed">
      Ви впевнені, що хочете видалити цей запит? <br>
      <span class="text-sm text-slate-400 font-normal">Цю дію неможливо буде скасувати.</span>
    </p>
    
    <div class="flex gap-4">
      <button 
        (click)="isDeleteModalOpen = false" 
        class="flex-1 py-4 bg-slate-50 text-slate-500 rounded-2xl font-black uppercase tracking-widest text-[10px] hover:bg-slate-100 transition-all">
        Скасувати
      </button>
      <button 
        (click)="confirmDelete()" 
        class="flex-[2] py-4 bg-red-500 text-white rounded-2xl font-black uppercase tracking-widest text-[10px] shadow-lg shadow-red-200 hover:bg-red-600 hover:-translate-y-0.5 transition-all active:scale-95">
        Так, видалити
      </button>
    </div>
  </div>
</app-modal>

<app-complete-review-modal
  [open]="isCompleteReviewOpen"
  [requestId]="completeReviewRequestId"
  (dismiss)="onCompleteReviewDismiss()"
  (success)="onCompleteReviewSuccess($event)"
/>
