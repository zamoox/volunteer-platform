<div class="min-h-screen flex items-center justify-center bg-slate-50 p-6 font-sans">
  <div 
    class="w-full max-w-lg rounded-[2.5rem] shadow-2xl shadow-slate-200/50 p-12 border transition-all duration-500 ease-in-out"
    [class.bg-white]="currentUserType === 'individual'"
    [class.border-slate-100]="currentUserType === 'individual'"
    [class.bg-slate-900]="currentUserType === 'organization'"
    [class.border-slate-800]="currentUserType === 'organization'"
  >
    
    <div class="text-center mb-10">
      <div class="inline-flex items-center justify-center w-16 h-16 rounded-3xl mb-6 shadow-lg transition-all duration-500"
           [class.bg-blue-600]="currentUserType === 'individual'"
           [class.bg-white]="currentUserType === 'organization'">
        <span class="text-2xl">{{ currentUserType === 'individual' ? '✨' : '🏢' }}</span>
      </div>
      <h2 class="text-3xl font-black tracking-tight leading-none transition-colors duration-500"
          [class.text-slate-950]="currentUserType === 'individual'"
          [class.text-white]="currentUserType === 'organization'">
        {{ currentUserType === 'individual' ? 'Створити профіль' : 'Реєстрація ГО/Фонду' }}
      </h2>
    </div>

    <form [formGroup]="registerForm" (ngSubmit)="onRegister()" class="space-y-5">
      
      <div class="flex p-1.5 rounded-2xl border transition-all duration-500"
           [class.bg-slate-50]="currentUserType === 'individual'"
           [class.border-slate-100]="currentUserType === 'individual'"
           [class.bg-slate-800/50]="currentUserType === 'organization'"
           [class.border-white/5]="currentUserType === 'organization'">
        
        <label class="flex-1 text-center py-3 rounded-xl cursor-pointer transition-all font-black text-[10px] uppercase tracking-widest"
               [class.bg-white]="currentUserType === 'individual'"
               [class.text-blue-600]="currentUserType === 'individual'"
               [class.text-slate-500]="currentUserType === 'organization'">
          <input type="radio" formControlName="userType" value="individual" class="hidden">
          Волонтер
        </label>
        
        <label class="flex-1 text-center py-3 rounded-xl cursor-pointer transition-all font-black text-[10px] uppercase tracking-widest"
               [class.bg-slate-700]="currentUserType === 'organization'"
               [class.text-white]="currentUserType === 'organization'"
               [class.text-slate-400]="currentUserType === 'individual'">
          <input type="radio" formControlName="userType" value="organization" class="hidden">
          Організація
        </label>
      </div>

      <div class="space-y-4">
        <div class="space-y-1">
          <label class="text-[10px] font-black uppercase tracking-widest ml-1 opacity-50 transition-colors"
                 [ngClass]="currentUserType === 'individual' ? 'text-slate-900' : 'text-white'">
            {{ currentUserType === 'individual' ? "Ім'я та Прізвище" : "Назва організації" }}
          </label>
          <input formControlName="name" type="text" 
                 class="w-full p-4 border rounded-2xl text-sm font-bold outline-none transition-all"
                 [ngClass]="dynamicInputClasses">
        </div>

        <div class="space-y-1">
          <label class="text-[10px] font-black uppercase tracking-widest ml-1 opacity-50 transition-colors"
                 [ngClass]="currentUserType === 'individual' ? 'text-slate-900' : 'text-white'">Номер телефону</label>
          <input 
            formControlName="phone"
            type="tel"
            placeholder="+380XXXXXXXXX"
            class="w-full p-4 border rounded-2xl text-sm font-bold outline-none transition-all"
            [ngClass]="dynamicInputClasses"
            appPhoneMask>
          <p *ngIf="isInvalid('phone')" class="text-[9px] text-red-500 font-bold ml-1 uppercase">{{ getErrorMessage('phone') }}</p>
        </div>

        <div class="space-y-1">
          <label class="text-[10px] font-black uppercase tracking-widest ml-1 opacity-50 transition-colors"
                 [ngClass]="currentUserType === 'individual' ? 'text-slate-900' : 'text-white'">Електронна пошта</label>
          <input formControlName="email" type="email" 
                 class="w-full p-4 border rounded-2xl text-sm font-bold outline-none transition-all"
                 [ngClass]="dynamicInputClasses">
        </div>

<div class="grid grid-cols-2 gap-4">
  <div class="space-y-1">
    <label class="text-[10px] font-black uppercase tracking-widest ml-1 opacity-50 transition-colors"
           [ngClass]="currentUserType === 'individual' ? 'text-slate-900' : 'text-white'">Область</label>
    <select formControlName="region" 
            class="w-full p-4 border rounded-2xl text-sm font-bold outline-none transition-all appearance-none"
            [ngClass]="dynamicInputClasses">
      <option value="" disabled selected>Оберіть...</option>
      <option *ngFor="let r of regions" [value]="r">{{r}}</option>
    </select>
  </div>

  <div class="space-y-1 relative"> <label class="text-[10px] font-black uppercase tracking-widest ml-1 opacity-50 transition-colors"
           [ngClass]="currentUserType === 'individual' ? 'text-slate-900' : 'text-white'">Місто</label>
    
    <div class="relative">
      <input formControlName="city" type="text" placeholder="Київ" autocomplete="off"
             class="w-full p-4 border rounded-2xl text-sm font-bold outline-none transition-all"
             [ngClass]="dynamicInputClasses"
             (blur)="hideCitySuggestions()">
      
      <div *ngIf="isSearchingCity" class="absolute right-4 top-1/2 -translate-y-1/2 flex items-center justify-center w-5 h-5">
        <span class="animate-spin rounded-full h-4 w-4 border-b-2 border-current opacity-50"></span>
      </div>
    </div>

    <ul *ngIf="citySuggestions.length > 0"
        class="absolute z-50 w-full mt-2 py-2 rounded-2xl shadow-2xl border backdrop-blur-md overflow-hidden max-h-60 overflow-y-auto"
        [class.bg-white/95]="currentUserType === 'individual'"
        [class.border-slate-100]="currentUserType === 'individual'"
        [class.bg-slate-800/95]="currentUserType === 'organization'"
        [class.border-white/10]="currentUserType === 'organization'">
      
      <li *ngFor="let city of citySuggestions"
          (click)="selectCity(city)"
          class="px-5 py-3 text-sm font-bold cursor-pointer transition-colors hover:bg-black/5"
          [class.text-slate-900]="currentUserType === 'individual'"
          [class.text-white]="currentUserType === 'organization'">
        {{ city }}
      </li>
    </ul>
  </div>
</div>

        <div class="space-y-1">
          <label class="text-[10px] font-black uppercase tracking-widest ml-1 opacity-50 transition-colors"
                 [ngClass]="currentUserType === 'individual' ? 'text-slate-900' : 'text-white'">Пароль</label>
          <input formControlName="password" type="password" placeholder="••••••••" 
                 class="w-full p-4 border rounded-2xl text-sm font-bold outline-none transition-all"
                 [ngClass]="dynamicInputClasses">
        </div>
      </div>

      <button 
        type="submit" 
        [disabled]="registerForm.invalid || isLoading" 
        class="w-full mt-4 py-5 rounded-2xl font-black text-[11px] uppercase tracking-[0.2em] shadow-xl transition-all active:scale-[0.98] disabled:opacity-30 disabled:cursor-not-allowed"
        [class.bg-slate-950]="currentUserType === 'individual'"
        [class.text-white]="currentUserType === 'individual'"
        [class.bg-white]="currentUserType === 'organization'"
        [class.text-slate-950]="currentUserType === 'organization'"
      >
        {{ isLoading ? 'Реєстрація...' : 'Створити акаунт' }}
      </button>
    </form>
  </div>
</div>
