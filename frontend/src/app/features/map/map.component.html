<div class="flex h-[calc(100vh-64px)] mt-16 overflow-hidden bg-slate-50">
  
  <!-- Бічна панель -->
  <aside class="hidden md:flex w-[400px] flex-col border-r border-slate-200 bg-white z-10 shadow-xl">
    <div class="p-6 border-b border-slate-50 bg-white">
      <h2 class="text-xl font-black text-slate-900 tracking-tight leading-none">Допомога поруч</h2>
      <p class="text-[10px] font-bold text-slate-400 uppercase tracking-[0.2em] mt-2">Актуальні запити</p>
    </div>

    <div class="flex-1 overflow-y-auto custom-scrollbar">
      <app-request-list 
        (requestSelected)="onSelectFromList($event)">
      </app-request-list>
    </div>
  </aside>

  <!-- Карта -->
  <main class="flex-1 relative">
    <app-map-view
      class="w-full h-full z-0 block"
      [requests]="store.requests()"
      [categories]="categories"
      (requestSelected)="onRequestSelectedFromMap($event)"
      (createRequestRequested)="onMapClickRequested($event.lat, $event.lng)"
      (createRequestConfirmed)="onMapCreateConfirmed($event)"
      (boundsChanged)="onMapBoundsChanged($event)"
      [currentUserId]="(user$ | async)?.id">
    </app-map-view>

    <!-- Модальні компоненти (z-index має бути > 1000 всередині них) -->
    <app-request-form 
      *ngIf="showForm" 
      [lat]="selectedLat" 
      [lng]="selectedLng" 
      [address]="selectedAddress"
      [requestToEdit]="selectedRequestToEdit" 
      (closed)="showForm = false; selectedRequestToEdit = null" 
      (submitted)="onFormSubmitted($event)">
    </app-request-form>

    <app-request-details 
      *ngIf="store.selectedRequest()" 
      [request]="store.selectedRequest()!"
      (closed)="store.select(null)"
      (responded)="onResponseSent($event)"
      (edit)="onEditRequest($event)"
      (delete)="onDeleteRequest($event)">
    </app-request-details>
  </main>
</div>

<app-modal 
  *ngIf="isDeleteModalOpen" 
  title="Видалення запиту" 
  (closed)="isDeleteModalOpen = false">
  
  <div class="text-center">
    <div class="mx-auto flex items-center justify-center h-20 w-20 rounded-[2rem] bg-red-50 mb-8 rotate-3">
      <span class="text-red-500 text-3xl -rotate-3">🗑️</span>
    </div>
    
    <p class="text-slate-600 mb-10 text-lg font-medium leading-relaxed">
      Ви впевнені, що хочете видалити цей запит? <br>
      <span class="text-sm text-slate-400 font-normal">Цю дію неможливо скасувати.</span>
    </p>
    
    <div class="flex gap-4">
      <button 
        (click)="isDeleteModalOpen = false" 
        class="flex-1 py-4 bg-slate-50 text-slate-500 rounded-2xl font-black uppercase tracking-widest text-[10px] hover:bg-slate-100 transition-all">
        Скасувати
      </button>
      <button 
        (click)="confirmDelete()" 
        class="flex-[2] py-4 bg-red-500 text-white rounded-2xl font-black uppercase tracking-widest text-[10px] shadow-lg shadow-red-200 hover:bg-red-600 hover:-translate-y-0.5 transition-all active:scale-95">
        Так, видалити
      </button>
    </div>
  </div>
</app-modal>
