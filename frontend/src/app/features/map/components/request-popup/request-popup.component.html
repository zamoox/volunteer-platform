<div class="request-popup group">
  <div class="p-5">
    <div class="flex items-start gap-4">
      <div class="w-1.5 h-12 rounded-full shrink-0" [style.background-color]="accentColor"></div>
      
      <div class="flex-1 min-w-0">
        <div class="flex items-center justify-between mb-1">
          <span class="text-[10px] font-black uppercase tracking-widest text-slate-400">
            {{ category?.label || 'Запит' }}
          </span>
          <div class="flex h-2 w-2 relative">
            <span *ngIf="request.status === 'in_progress'" 
                  class="animate-ping absolute inline-flex h-full w-full rounded-full bg-blue-400 opacity-75"></span>
            <span class="relative inline-flex rounded-full h-2 w-2"
                  [ngClass]="request.status === 'open' ? 'bg-emerald-500' : 'bg-blue-500'"></span>
          </div>
        </div>

        <h3 class="text-base font-black text-slate-900 leading-tight truncate mb-2">
          {{ request.title }}
        </h3>

        <div class="flex items-center gap-1.5 text-slate-500">
          <svg class="w-3.5 h-3.5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
          </svg>
          <p class="text-xs font-medium truncate leading-none">
            {{ request.location.address || 'Локація на мапі' }}
          </p>
        </div>
      </div>
    </div>
  </div>

  <button (click)="onDetailsClick($event)" 
          class="w-full flex items-center justify-between px-5 py-3.5 bg-slate-50 hover:bg-slate-900 text-slate-400 hover:text-white transition-all duration-300 rounded-b-[1.25rem] group/btn">
    <div class="flex items-center gap-2 text-[10px] font-bold uppercase tracking-wider">
      <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
      {{ request.createdAt | date:'d MMM, HH:mm' }}
    </div>
    <div class="flex items-center gap-1 text-[10px] font-black uppercase tracking-widest text-slate-900 group-hover/btn:text-white">
      ДЕТАЛІ
      <svg class="w-3 h-3 group-hover/btn:translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M13 7l5 5m0 0l-5 5m5-5H6" />
      </svg>
    </div>
  </button>
</div>
