<div class="flex flex-col h-full bg-white">

  <div class="p-4 space-y-4 border-b border-slate-100 bg-white/50 backdrop-blur-sm sticky top-0 z-10">
    <!-- Поле пошуку -->
    <div class="relative group">
      <input 
        [ngModel]="searchTerm$ | async"
        (ngModelChange)="onSearch($event)"
        type="text" 
        placeholder="Пошук потреби..."
        class="w-full pl-10 pr-4 py-2.5 bg-slate-100 border-none rounded-xl text-sm focus:ring-2 focus:ring-blue-500/20 transition-all outline-none"
      >
      <svg class="w-4 h-4 absolute left-3 top-3 text-slate-400 group-focus-within:text-blue-500 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
      </svg>
    </div>

    <!-- Кнопки сортування -->
    <div class="flex items-center gap-2">
      <button 
        (click)="onSort('date')"
        [class.bg-slate-900]="(sortBy$ | async) === 'date'"
        [class.text-white]="(sortBy$ | async) === 'date'"
        class="flex-1 py-1.5 rounded-lg text-[10px] font-black uppercase tracking-tighter border border-slate-200 transition-all"
      >
        📅 Спочатку нові
      </button>
      <button 
        (click)="onSort('title')"
        [class.bg-slate-900]="(sortBy$ | async) === 'title'"
        [class.text-white]="(sortBy$ | async) === 'title'"
        class="flex-1 py-1.5 rounded-lg text-[10px] font-black uppercase tracking-tighter border border-slate-200 transition-all"
      >
        🔤 За алфавітом
      </button>
    </div>
  </div>

  <!-- Панель фільтрів -->
  <div class="p-4 border-b border-slate-50">
    <div class="flex items-center justify-between mb-3">
      <span class="text-[10px] font-black uppercase tracking-widest text-slate-400">Фільтр</span>
      <button (click)="setCategory(null)" class="text-[10px] font-bold text-blue-600 hover:underline">Скинути</button>
    </div>
    
    <div class="flex gap-2 overflow-x-auto pb-2 no-scrollbar">
      <button 
        *ngFor="let cat of categories"
        (click)="setCategory(cat.id)"
        class="px-3 py-1.5 rounded-xl text-[10px] font-black uppercase tracking-wider transition-all whitespace-nowrap border"
        [class.bg-blue-600]="(selectedCategory$ | async) === cat.id"
        [class.text-white]="(selectedCategory$ | async) === cat.id"
        [class.bg-slate-50]="(selectedCategory$ | async) !== cat.id"
        [class.border-transparent]="(selectedCategory$ | async) !== cat.id"
      >
        {{ cat.label }}
      </button>
    </div>
  </div>

  <!-- Список запитів -->
  <div class="flex-1 overflow-y-auto p-4 space-y-4 custom-scrollbar">
    <ng-container *ngIf="filteredRequests$ | async as requests">
      <div *ngFor="let request of requests" 
          (click)="selectRequest(request)"
          class="p-4 border-b border-slate-50 hover:bg-slate-50 cursor-pointer transition-colors group">
        
        <div class="flex justify-between items-start mb-1">
          <h3 class="font-bold text-slate-900 group-hover:text-blue-600 transition-colors line-clamp-1">
            {{ request.title }}
          </h3>
          <span class="w-2 h-2 rounded-full mt-1.5" 
                [ngClass]="request.status === 'open' ? 'bg-green-500' : 'bg-blue-500'">
          </span>
        </div>

        <div class="flex items-center gap-3 text-[10px] font-bold uppercase tracking-widest text-slate-400">
          <span>{{ getCategoryLabel(request.category) }}</span>
          <span>•</span>
          <span>{{ request.createdAt | date:'dd.MM HH:mm' }}</span>
        </div>
      </div>

      <!-- Емпті стейт -->
      <div *ngIf="requests.length === 0" class="text-center py-10">
        <p class="text-xs font-bold text-slate-400 uppercase tracking-widest italic">Нічого не знайдено 📦</p>
      </div>
    </ng-container>
  </div>
</div>
