<div 
  class="bg-white/90 backdrop-blur-md border border-slate-200/80 shadow-2xl rounded-3xl transition-all duration-300 ease-in-out overflow-hidden flex flex-col select-none"
  [ngClass]="isCollapsed ? 'w-14 h-[280px] p-2' : 'w-72 h-[280px] p-4'"
>
  
  <div class="flex items-start mb-4" [ngClass]="isCollapsed ? 'justify-center' : 'justify-between'">
    
    <div *ngIf="!isCollapsed" class="whitespace-nowrap animate-in fade-in duration-500">
      <h4 class="text-xs font-black uppercase tracking-widest text-slate-400">Аналітичні шари ГІС</h4>
      <p class="text-[11px] text-slate-500 font-medium mt-0.5">Керування даними</p>
    </div>

    <button 
      (click)="toggleCollapse()"
      class="flex-shrink-0 flex justify-center items-center w-10 h-10 rounded-2xl bg-slate-100 hover:bg-slate-200 text-slate-600 transition-all focus:outline-none"
      [title]="isCollapsed ? 'Розгорнути' : 'Згорнути'"
    >
      <svg *ngIf="isCollapsed" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 6h9.75M10.5 6.75l.3-.3m-.3.3l.3.3m0 5.4L10.5 12l.3.3m7.95-3l.3.3m0-3.6l-.3.3m-13.2 3h.75m-.75 0a.75.75 0 110-1.5.75.75 0 010 1.5zm0 9a.75.75 0 110-1.5.75.75 0 010 1.5zm0-4.5a.75.75 0 110-1.5.75.75 0 010 1.5zm0-4.5a.75.75 0 110-1.5.75.75 0 010 1.5zm10.5-11.25h.75m-.75 0a.75.75 0 110-1.5.75.75 0 010 1.5zm0 9h.75m-.75 0a.75.75 0 110-1.5.75.75 0 010 1.5zm0 4.5h.75m-.75 0a.75.75 0 110-1.5.75.75 0 010 1.5z" />
      </svg>
      <svg *ngIf="!isCollapsed" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-4 h-4">
        <path stroke-linecap="round" stroke-linejoin="round" d="M18.75 19.5l-7.5-7.5 7.5-7.5m-6 15L5.25 12l7.5-7.5" />
      </svg>
    </button>
  </div>

  <div *ngIf="!isCollapsed" class="flex flex-col flex-1 gap-2 animate-in fade-in slide-in-from-right-4 duration-300">
    <div class="flex flex-col gap-2">
      <button 
        (click)="setMode(false)"
        [class.bg-slate-900]="!isHeatmapMode"
        [class.text-white]="!isHeatmapMode"
        [class.bg-slate-50]="isHeatmapMode"
        [class.text-slate-700]="isHeatmapMode"
        class="w-full px-4 py-3 rounded-xl font-bold text-[10px] uppercase tracking-wider border border-transparent transition-all flex items-center gap-2.5"
      >
        <span class="text-sm">📍</span>
        <span class="whitespace-nowrap">Точкові запити (Кластери)</span>
      </button>

      <button 
        (click)="setMode(true)"
        [class.bg-blue-600]="isHeatmapMode"
        [class.text-white]="isHeatmapMode"
        [class.bg-slate-50]="!isHeatmapMode"
        [class.text-slate-700]="!isHeatmapMode"
        class="w-full px-4 py-3 rounded-xl font-bold text-[10px] uppercase tracking-wider border border-transparent transition-all flex items-center justify-between group"
      >
        <div class="flex items-center gap-2.5">
          <span class="text-sm">🔥</span>
          <span class="whitespace-nowrap">Теплова карта пріоритетів</span>
        </div>
        <span *ngIf="isHeatmapMode" class="w-1.5 h-1.5 rounded-full bg-white animate-pulse"></span>
      </button>
    </div>

    <div class="mt-auto pt-2.5 border-t border-slate-100 text-[9px] text-slate-400 font-medium leading-tight italic">
      * Масштабування та щільність теплової карти автоматично зважені на інтегральний індекс пріоритетності (Priority Score).
    </div>
  </div>

  <div *ngIf="isCollapsed" class="flex-1 flex items-center justify-center">
    <div class="rotate-180 [writing-mode:vertical-lr] text-[10px] font-black uppercase tracking-[0.2em] text-slate-300">
        GIS LAYERS
    </div>
  </div>
</div>
