<div class="fixed top-6 right-6 z-[3000] flex flex-col gap-3 pointer-events-none">
      <div *ngFor="let toast of toasts$ | async" 
           (click)="remove(toast.id)"
           class="pointer-events-auto cursor-pointer group relative overflow-hidden min-w-[320px] max-w-[400px] p-4 rounded-2xl border backdrop-blur-xl shadow-2xl transition-all duration-500 animate-in slide-in-from-right-full"
           [ngClass]="getStyles(toast.type)">
        
        <!-- Декоративний градієнтний фон -->
        <div class="absolute inset-0 opacity-10 bg-gradient-to-br from-white to-transparent"></div>

        <div class="relative flex items-start gap-4">
          <!-- Іконка з м'яким фоном -->
          <div class="flex-shrink-0 w-10 h-10 rounded-xl flex items-center justify-center text-xl shadow-inner bg-white/20">
            {{ getIcon(toast.type) }}
          </div>

          <div class="flex flex-col gap-0.5">
            <h3 class="font-black text-sm tracking-tight leading-none">{{ toast.title }}</h3>
            <p class="text-[11px] font-medium opacity-80 leading-relaxed">{{ toast.message }}</p>
          </div>

          <!-- Кнопка закриття (з'являється при ховері) -->
          <button class="ml-auto opacity-0 group-hover:opacity-100 transition-opacity">
             <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
          </button>
        </div>

        <!-- Прогрес-бар (візуальний таймер) -->
        <div class="absolute bottom-0 left-0 h-[3px] bg-current opacity-20 animate-progress"></div>
      </div>
    </div>
