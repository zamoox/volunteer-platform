<div class="fixed inset-0 z-[3000] flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm animate-in fade-in duration-300">
  <div class="relative w-full max-w-2xl bg-white shadow-2xl rounded-[2.5rem] border border-slate-100 flex flex-col overflow-hidden animate-in zoom-in-95 duration-300">
    
    <div class="px-10 py-8 border-b border-slate-50 flex justify-between items-center">
      <h2 class="text-2xl font-black tracking-tight text-slate-900">{{ title }}</h2>
      <button (click)="close()" class="p-2 hover:bg-slate-100 rounded-xl text-slate-400 transition-colors">✕</button>
    </div>

    <div class="p-10 overflow-y-auto max-h-[80vh] custom-scrollbar">
      <ng-content></ng-content>
    </div>

  </div>
</div>
