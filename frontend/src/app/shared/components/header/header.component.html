<header 
  [class.h-10]="isMapMode$ | async" 
  [class.h-20]="!(isMapMode$ | async)" 
  class="fixed top-0 left-0 right-0 z-[2000] bg-white/90 backdrop-blur-md border-b border-slate-100 transition-all duration-300 flex items-center"
>
  <div class="w-full max-w-7xl mx-auto px-6 flex items-center justify-between">
    
    <a routerLink="/" class="flex items-center gap-2 cursor-pointer group">
      <div 
        [class.w-7]="isMapMode$ | async" 
        [class.h-7]="isMapMode$ | async" 
        [class.w-11]="!(isMapMode$ | async)" 
        [class.h-11]="!(isMapMode$ | async)" 
        class="bg-slate-950 rounded-lg flex items-center justify-center transition-all duration-300 group-hover:rotate-[10deg] group-hover:bg-blue-600 shadow-sm"
      >
        <svg xmlns="http://www.w3.org/2000/svg" 
             [class.w-4]="isMapMode$ | async" 
             [class.h-4]="isMapMode$ | async" 
             [class.w-6]="!(isMapMode$ | async)" 
             [class.h-6]="!(isMapMode$ | async)" 
             class="text-white transition-all duration-300" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"
        >
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        </svg>
      </div>
      <div class="flex flex-col">
        <span 
          [class.text-sm]="isMapMode$ | async" 
          [class.text-xl]="!(isMapMode$ | async)" 
          class="font-black tracking-tighter text-slate-900 group-hover:text-blue-600 transition-all duration-300 leading-none"
        >
          VOLUNTEER
        </span>
        <span *ngIf="!(isMapMode$ | async)" class="text-[8px] font-black uppercase tracking-[0.2em] text-slate-400 mt-1 transition-all">
          Платформа єдності
        </span>
      </div>
    </a>

    <nav *ngIf="!(isMapMode$ | async)" class="hidden md:flex items-center gap-8 text-[11px] font-black uppercase tracking-widest text-slate-500 transition-all">
      <a routerLink="/map" routerLinkActive="text-blue-600" class="hover:text-slate-900 transition-colors relative after:content-[''] after:absolute after:-bottom-1 after:left-0 after:w-0 after:h-0.5 after:bg-blue-600 after:transition-all hover:after:w-full">Карта запитів</a>
      
      <a routerLink="/how-to-help" routerLinkActive="text-blue-600" class="hover:text-slate-900 transition-colors relative after:content-[''] after:absolute after:-bottom-1 after:left-0 after:w-0 after:h-0.5 after:bg-blue-600 after:transition-all hover:after:w-full">Як допомогти</a>
      
      <a routerLink="/about" routerLinkActive="text-blue-600" class="hover:text-slate-900 transition-colors relative after:content-[''] after:absolute after:-bottom-1 after:left-0 after:w-0 after:h-0.5 after:bg-blue-600 after:transition-all hover:after:w-full">Про проєкт</a>
    </nav>

    <div class="flex items-center gap-4">
      
      <ng-container *ngIf="!(authService.currentUser$ | async); else userMenu">
        <div class="flex items-center" [class.gap-2]="isMapMode$ | async" [class.gap-4]="!(isMapMode$ | async)">
          <button routerLink="/login" 
                  [class.py-1]="isMapMode$ | async" 
                  [class.py-2.5]="!(isMapMode$ | async)"
                  class="px-3 text-[10px] font-black uppercase tracking-widest text-slate-900 hover:bg-slate-100 rounded-xl transition-all"
          >
            Увійти
          </button>
          
          <button *ngIf="!(isMapMode$ | async)" type="button" (click)="onCreateRequest()"
            class="px-6 py-3 text-[11px] font-black uppercase tracking-widest bg-blue-600 text-white rounded-xl shadow-lg shadow-blue-200 hover:bg-blue-700 hover:-translate-y-0.5 transition-all"
          >
            Створити запит
          </button>
        </div>
      </ng-container>

      <ng-template #userMenu>
        @if(authService.currentUser$ | async; as user) {
          <div class="flex items-center border-l border-slate-100 transition-all" 
               [class.gap-3]="isMapMode$ | async" [class.pl-2]="isMapMode$ | async"
               [class.gap-6]="!(isMapMode$ | async)" [class.pl-4]="!(isMapMode$ | async)"
          >
            
            <button
              *ngIf="canCreateRequest() && !(isMapMode$ | async)"
              type="button"
              class="px-6 py-3 text-[11px] font-black uppercase tracking-widest bg-blue-600 text-white rounded-xl shadow-lg shadow-blue-200 hover:bg-blue-700 hover:-translate-y-0.5 transition-all active:scale-95"
              (click)="onCreateRequest()"
            >
              Створити запит
            </button>

            <a routerLink="/profile" class="flex items-center gap-2 group cursor-pointer">
              <div class="text-right hidden sm:block" *ngIf="!(isMapMode$ | async)">
                <span [class]="getRoleBadgeClasses(user.role)">
                  {{ getRoleLabel(user.role) }}
                </span>
                <p class="text-[11px] font-black tracking-tight text-slate-900 leading-none">
                  {{ user.firstName || user.email.split('@')[0] }}
                </p>
              </div>

              <div class="rounded-lg flex items-center justify-center border-2 border-transparent transition-all shadow-sm overflow-hidden text-xs relative font-bold text-white bg-slate-900"
                   [class.w-7]="isMapMode$ | async" [class.h-7]="isMapMode$ | async"
                   [class.w-10]="!(isMapMode$ | async)" [class.h-10]="!(isMapMode$ | async)"
                   [ngClass]="{
                     'group-hover:border-blue-500': user.role === 'volunteer',
                     'group-hover:border-purple-500': user.role === 'organization',
                     'group-hover:border-amber-400': user.role === 'admin'
                   }"
              >
                <span>{{ (user.firstName?.[0] || user.email?.[0])?.toUpperCase() }}</span>
              </div>
            </a>

            <button (click)="onLogout()" 
              class="text-slate-400 hover:text-red-500 hover:bg-red-50 rounded-lg transition-all group relative"
              [class.p-1]="isMapMode$ | async" [class.p-2.5]="!(isMapMode$ | async)"
              title="Вийти"
            >
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" 
                   [class.w-4]="isMapMode$ | async" [class.h-4]="isMapMode$ | async"
                   [class.w-5]="!(isMapMode$ | async)" [class.h-5]="!(isMapMode$ | async)"
                   class="transition-transform group-hover:translate-x-1"
              >
                <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15m3 0l3-3m0 0l-3-3m3 3H9" />
              </svg>
            </button>
          </div>
        }
      </ng-template>

    </div>
  </div>
</header>
